<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VScan · attack-surface overview</title>
  <meta name="description" content="A high-level map of what a public entry point reaches, and which dependencies are actually exploitable. Ask the agent for the detail." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
</head>
<body>
  <a class="skip-link" href="#graph">Skip to graph</a>

  <!-- Minimal header: wordmark + Meta Muse mark on the left; the scan selector and
       the "Ask VScan" bridge to the chat agent on the right. Everything deep lives
       in the graph + the chat agent, so the chrome stays a single slim bar. -->
  <header class="titleblock" role="banner">
    <div class="titleblock__id">
      <span class="wordmark">VScan</span>
      <span class="meta-mark" title="AI narratives are generated by Meta Muse via VScan's MCP tools">
        <span class="meta-mark__dot" aria-hidden="true"></span>Powered by Meta Muse
      </span>
    </div>
    <div class="titleblock__load">
      <div class="viewswitch" id="viewswitch" role="group" aria-label="Choose a scan to view">
        <button class="seg" id="view-demo" type="button" aria-pressed="true">
          <span class="seg__name">ACME API</span>
        </button>
        <button class="seg" id="view-pluginreports" type="button" aria-pressed="false">
          <span class="seg__name">Plugin Reports</span>
        </button>
        <label class="seg seg--file" id="view-file">
          <input type="file" id="file" accept=".json,application/json" />
          <span class="seg__name">Load a scan</span>
        </label>
      </div>
      <a class="askvscan" id="askvscan" href="chat.html">Ask VScan <span aria-hidden="true">→</span></a>
      <span class="scanname" id="scanname">starting…</span>
    </div>
  </header>

  <!-- Compact impact funnel + noise line: the numbers are unchanged; only quieter. -->
  <div class="funnel" id="funnel" role="group" aria-label="Impact funnel" hidden></div>
  <p class="noise" id="noise" hidden></p>

  <main class="layout">
    <aside class="rail" aria-label="Vulnerable entry points">
      <section class="panel" aria-labelledby="ep-h">
        <h2 class="panel__h" id="ep-h">Vulnerable endpoints</h2>
        <p class="panel__note" id="ep-note">Public routes that reach a known vulnerability.</p>
        <ul class="eplist" id="eplist"></ul>
      </section>
    </aside>

    <section class="stage" aria-label="Attack-surface diagram">
      <div class="stage__banner" id="banner" role="status" aria-live="polite" hidden></div>
      <div class="stage__canvas">
        <div class="stage__grid" aria-hidden="true"></div>
        <div id="graph" tabindex="0" role="application" aria-label="Repository attack-surface graph. Entry points on the left flow through functions to dependencies on the right. Click a node to inspect it; hover for a one-line summary."></div>
        <p class="stage__flow" aria-hidden="true">entry points <span>→</span> functions <span>→</span> dependencies</p>

        <div class="tooltip" id="tooltip" role="status" aria-live="polite" hidden></div>
        <div class="zoomctl" role="group" aria-label="Zoom">
          <button type="button" class="zoomctl__btn" id="zoom-in" aria-label="Zoom in">+</button>
          <button type="button" class="zoomctl__btn zoomctl__btn--fit" id="zoom-fit" aria-label="Fit the diagram to view">⤢</button>
          <button type="button" class="zoomctl__btn" id="zoom-out" aria-label="Zoom out">−</button>
        </div>
      </div>

      <!-- A single-line key. The deep key lives in the hover tooltip + the pop-out;
           this just orients the eye. AI states are kept visually distinct here. -->
      <div class="keystrip" id="keystrip" aria-label="Legend">
        <span class="k"><i class="kdot kdot--exploit"></i>exploitable</span>
        <span class="k"><i class="kdot kdot--reach"></i>reachable</span>
        <span class="k"><i class="kdot kdot--vuln"></i>vulnerable · not reached</span>
        <span class="k k--ai"><i class="kdot kdot--likely"></i>likely reachable · AI</span>
        <span class="k k--ai"><i class="kdot kdot--danger"></i>code-level risk · AI</span>
        <span class="k k--ai"><i class="kdot kdot--public"></i>public</span>
      </div>
    </section>

    <aside class="detail" id="detail" aria-label="Selected item" aria-live="polite">
      <div class="detail__inner" id="detail-inner"></div>
    </aside>
  </main>

  <script src="sample-bundle.js"></script>
  <script src="sample-graph.js"></script>
  <script src="md.js"></script>
  <script src="app.js"></script>
</body>
</html>
