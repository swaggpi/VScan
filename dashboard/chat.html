<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ask VScan · Meta Muse</title>
  <meta name="description" content="Ask questions about your scanned project. Meta Muse answers by calling VScan's MCP tools." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/chat.css" />
</head>
<body>
  <header class="bar" role="banner">
    <div class="bar__id">
      <span class="wordmark">VScan</span>
      <h1 class="bar__title">Ask VScan</h1>
    </div>
    <div class="bar__right">
      <span class="meta-badge" title="Answers are generated by Meta Muse via VScan's MCP tools">
        <span class="meta-badge__mark" aria-hidden="true"></span>
        Powered by Meta Muse
      </span>
      <a class="bar__back" href="/">&larr; Dashboard</a>
    </div>
  </header>

  <main class="chat" id="chat">
    <div class="transcript" id="transcript" role="log" aria-live="polite" aria-relevant="additions" aria-label="Conversation">
      <section class="welcome" id="welcome">
        <p class="welcome__eyebrow">MCP-driven analysis</p>
        <h2 class="welcome__title">Ask anything about the scanned project.</h2>
        <p class="welcome__lede">Muse answers by calling VScan's tools over MCP. You will see every call it makes under its reply.</p>
        <div class="starters" id="starters" role="group" aria-label="Example questions"></div>
      </section>
    </div>
  </main>

  <form class="composer" id="composer" autocomplete="off">
    <label class="sr-only" for="input">Your question</label>
    <textarea id="input" class="composer__input" rows="1" maxlength="4000"
              placeholder="Ask about vulnerabilities, attack paths, fixes…"></textarea>
    <button class="composer__send" id="send" type="submit">Send</button>
    <p class="composer__hint">Enter to send &middot; Shift+Enter for a new line</p>
  </form>

  <script src="/md.js"></script>
  <script src="/chat.js"></script>
</body>
</html>
