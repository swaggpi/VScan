<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VScan demo teleprompter</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #121c2e;
    --line: #1e2b42;
    --text: #e8eef9;
    --dim: #6b7f9e;
    --accent: #ffb020;
    --cue: #7aa2ff;
    --danger: #ff5c5c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .brand { font-weight: 700; letter-spacing: .02em; }
  .brand span { color: var(--accent); }
  .clock { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 700; }
  .clock.over { color: var(--danger); }
  .beat { color: var(--dim); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
  .keys { margin-left: auto; color: var(--dim); font-size: 13px; }
  .keys b { color: var(--text); font-weight: 600; }

  .bar { height: 4px; background: var(--line); position: relative; }
  .bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); width: 0; }
  .bar u {
    position: absolute; top: -3px; bottom: -3px; width: 2px;
    background: var(--danger); left: 100%; /* set by JS to the 3:00 mark */
  }

  main { flex: 1; display: grid; grid-template-columns: minmax(0,1fr) 300px; min-height: 0; overflow: hidden; }
  .stage {
    position: relative; overflow: hidden; padding: 0 48px;
    display: flex; flex-direction: column; justify-content: center; gap: 22px;
  }
  .now { font-size: clamp(28px, 4.2vw, 52px); font-weight: 650; line-height: 1.25; }
  .now code { background: #1b2740; padding: 0 .2em; border-radius: 4px; font-size: .92em; }
  .next { font-size: clamp(16px, 1.9vw, 24px); color: var(--dim); line-height: 1.35; }
  .next code { background: #16213a; padding: 0 .2em; border-radius: 4px; }
  .cue {
    align-self: flex-start; border: 1px solid var(--cue); color: var(--cue);
    border-radius: 999px; padding: 6px 16px; font-size: 15px; font-weight: 600;
    letter-spacing: .02em;
  }
  .cue.hidden { visibility: hidden; }
  .linebar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .linebar i { display: block; height: 100%; width: 0; background: var(--cue); }

  aside {
    border-left: 1px solid var(--line); background: var(--panel);
    overflow-y: auto; padding: 12px;
  }
  aside h2 {
    margin: 0 0 8px; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--dim);
  }
  ol { list-style: none; margin: 0; padding: 0; }
  li {
    padding: 7px 9px; border-radius: 6px; font-size: 13px; color: var(--dim);
    cursor: pointer; display: flex; gap: 8px; align-items: baseline;
  }
  li:hover { background: #18233a; }
  li .t { font-variant-numeric: tabular-nums; font-size: 11px; opacity: .8; }
  li.on { background: #1d2b47; color: var(--text); }
  li.done { color: #44577a; }
  li.beat-start { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 11px; }

  .paused {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(11,18,32,.82); font-size: 20px; color: var(--dim);
  }
  .paused.hidden { display: none; }
  @media (prefers-reduced-motion: no-preference) {
    .now, .next { transition: opacity .18s ease; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">VScan <span>teleprompter</span></div>
  <div class="clock" id="clock">0:00</div>
  <div class="beat" id="beat">ready</div>
  <div class="keys">
    <b>Space</b> start / pause · <b>←</b> <b>→</b> line · <b>R</b> reset · <b>+ −</b> speed <span id="rate">1.0×</span>
  </div>
</header>
<div class="bar"><i id="prog"></i><u id="limit"></u></div>

<main>
  <section class="stage">
    <div class="cue hidden" id="cue"></div>
    <div class="now" id="now">Press <b>Space</b> to start.</div>
    <div class="linebar"><i id="lineprog"></i></div>
    <div class="next" id="next"></div>
    <div class="paused hidden" id="paused">paused</div>
  </section>
  <aside>
    <h2>Run sheet</h2>
    <ol id="sheet"></ol>
  </aside>
</main>

<script>
// Each line: [seconds, text, cue?]  — cue shows the screen action to take as the line starts.
const SCRIPT = [
  ["Beat 0 · why now", [
    [5, "AI is finding vulnerabilities faster than anyone can triage them. 2026 is on track for about sixty-six thousand CVEs — roughly double last year.", "CARD · the AI-CVE surge"],
    [4, "But volume isn't risk. Of a thousand AI-assisted findings, fourteen were ever seen exploited."],
    [5, "So the hard part isn't finding flaws any more. It's knowing which one reaches your code — and turns a request into a shell."],
  ]],
  ["Beat 1 · the noise", [
    [6, "Here's that problem in one small Flask service: a hundred and forty-five known CVEs, and no idea which of them matter.", "TERMINAL · scroll the CVE wall"],
  ]],
  ["Beat 2 · the scan", [
    [7, "VScan builds a call graph with tree-sitter, and traces every public route into your dependencies,", "RUN · vscan audit samples/acme-api"],
    [6, "then runs taint analysis to see whether attacker-controlled input reaches the vulnerable call."],
    [6, "Nineteen dependencies. A hundred and forty-five CVEs. Sixteen reachable.", "LAND ON · the Funnel line"],
    [5, "One where the vulnerable function is really called — and that one is exploitable."],
    [4, "Sixty-eight percent of call sites resolve; the rest are flagged, not dismissed."],
  ]],
  ["Beat 3 · the graph", [
    [8, "This is the whole attack surface. Public entry points on the left, your functions in the middle, dependencies on the right.", "SWITCH · dashboard ?demo=1 (stage 0)"],
    [4, "Ten public routes reach a vulnerable package.", "PRESS → · left panel in"],
    [3, "These are the ones worth your afternoon."],
    [5, "Here's the one that matters. POST /documents/import takes the request body,", "PRESS → · drawer + path"],
    [5, "hands it through two service layers into a config loader, and calls yaml.full_load on it —"],
    [5, "PyYAML 5.3.1, CVE-2020-14343, arbitrary code execution."],
    [7, "That chain is the proof: attacker input to vulnerable call, rendered straight from the call graph."],
    [7, "A conventional scanner hands you a hundred and forty-five alerts. VScan proves one is exploitable.", "PRESS → · funnel bar in"],
  ]],
  ["Beat 4 · Muse", [
    [7, "That red card is an AI pen-tester's hypothesis — labelled unverified, and it lands on the same call.", "HOLD · the drawer's AI card"],
    [4, "It's one of four layers running on Meta's Muse Spark Open."],
    [6, "Muse triages every reachable CVE at symbol level — here it clears requests CVE-2024-35195,", "SWITCH · triage output in terminal"],
    [7, "because the project only calls requests.post and never reuses a pooled Session, which is what that CVE needs."],
    [5, "And it only gets to say that when the CVE names a function the code demonstrably never calls."],
    [5, "On a second project, it reads your docs to judge which routes are internet-facing.", "SWITCH · Plugin Reports scan"],
    [8, "And where static analysis hits dynamic dispatch, Muse proposes the edges it can't resolve — marked likely, never proven."],
    [3, "And you can just ask it.", "SWITCH · chat.html, send the question"],
    [6, "Muse answers by calling VScan's own tools over MCP, and it shows you every call it made.", "CUT · jump to the rendered answer"],
    [5, "Nothing it says can change a verdict — the model advises, the static analysis decides."],
  ]],
  ["Beat 5 · shipping it", [
    [5, "It runs where you work: a GitHub Action posts this comment on every pull request,", "SWITCH · PR comment"],
    [5, "uploads SARIF to code scanning, and gates CI on an exploitable path, not a CVE count."],
  ]],
  ["Beat 6 · close", [
    [8, "Everything here was built during the hackathon: the scanner, the taint engine, the four Muse layers, the MCP server, the Action and this dashboard — all open source.", "SWITCH · README"],
    [5, "A hundred and forty-five alerts in. One that matters out.", "SWITCH · the funnel, hold"],
  ]],
];

const LIMIT = 180; // hard 3:00
const lines = [];
SCRIPT.forEach(([beat, items]) => {
  items.forEach(([dur, text, cue], i) => {
    lines.push({ dur, text, cue, beat, first: i === 0 });
  });
});
let starts = [], acc = 0;
lines.forEach(l => { starts.push(acc); acc += l.dur; });
const TOTAL = acc;

const $ = id => document.getElementById(id);
const fmt = s => {
  s = Math.max(0, Math.round(s));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
};
const mark = t => t.replace(/`([^`]+)`/g, "<code>$1</code>");

// Run sheet
const sheet = $("sheet");
lines.forEach((l, i) => {
  const li = document.createElement("li");
  if (l.first) li.classList.add("beat-start");
  li.innerHTML = '<span class="t">' + fmt(starts[i]) + "</span><span>" + mark(l.text) + "</span>";
  li.onclick = () => { idx = i; elapsed = starts[i]; lineT = 0; render(); };
  sheet.appendChild(li);
});
const items = [...sheet.children];
$("limit").style.left = Math.min(100, (LIMIT / TOTAL) * 100) + "%";

let idx = 0, lineT = 0, elapsed = 0, rate = 1, running = false, last = 0;

function render() {
  const l = lines[idx];
  $("now").innerHTML = l ? mark(l.text) : "<b>End.</b> " + fmt(TOTAL) + " of 3:00.";
  $("next").innerHTML = lines[idx + 1] ? mark(lines[idx + 1].text) : "";
  $("beat").textContent = l ? l.beat : "done";
  const cue = $("cue");
  if (l && l.cue) { cue.textContent = l.cue; cue.classList.remove("hidden"); }
  else cue.classList.add("hidden");

  $("clock").textContent = fmt(elapsed);
  $("clock").classList.toggle("over", elapsed > LIMIT);
  $("prog").style.width = Math.min(100, (elapsed / TOTAL) * 100) + "%";
  $("lineprog").style.width = l ? Math.min(100, (lineT / l.dur) * 100) + "%" : "0%";
  $("rate").textContent = rate.toFixed(1) + "×";
  $("paused").classList.toggle("hidden", running);

  items.forEach((li, i) => {
    li.classList.toggle("on", i === idx);
    li.classList.toggle("done", i < idx);
  });
  const on = items[idx];
  if (on) on.scrollIntoView({ block: "center", behavior: "smooth" });
}

function tick(ts) {
  if (!running) return;
  if (!last) last = ts;
  const dt = ((ts - last) / 1000) * rate;
  last = ts;
  elapsed += dt; lineT += dt;
  const l = lines[idx];
  if (l && lineT >= l.dur) {
    lineT -= l.dur;
    if (idx < lines.length - 1) idx++;
    else { running = false; lineT = 0; }
  }
  render();
  requestAnimationFrame(tick);
}

function toggle() {
  running = !running; last = 0;
  if (running) requestAnimationFrame(tick);
  render();
}
function step(d) {
  idx = Math.min(lines.length - 1, Math.max(0, idx + d));
  elapsed = starts[idx]; lineT = 0; render();
}
function reset() {
  running = false; idx = 0; lineT = 0; elapsed = 0; last = 0; render();
}

addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); toggle(); }
  else if (e.code === "ArrowRight") { e.preventDefault(); step(1); }
  else if (e.code === "ArrowLeft") { e.preventDefault(); step(-1); }
  else if (e.key === "r" || e.key === "R") reset();
  else if (e.key === "+" || e.key === "=") { rate = Math.min(2, rate + 0.1); render(); }
  else if (e.key === "-" || e.key === "_") { rate = Math.max(0.5, rate - 0.1); render(); }
});

render();
</script>
</body>
</html>
