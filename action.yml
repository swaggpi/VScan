name: vulnreach
description: >-
  Reachability-aware dependency vulnerability scan. Uploads SARIF to GitHub code
  scanning and posts a PR comment with the reachable-vulnerability funnel.
author: swaggpi

branding:
  icon: shield
  color: purple

inputs:
  path:
    description: Repository path to scan.
    required: false
    default: "."
  fail-on:
    description: >-
      Fail the job when a finding meets this bar: never, reachable, confirmed,
      tainted (exploitable), or any finding at all.
    required: false
    default: reachable
  offline:
    description: Query no network vulnerability database; still analyzes reachability.
    required: false
    default: "false"
  comment:
    description: Post (and idempotently update) a PR comment on pull_request events.
    required: false
    default: "true"
  upload-sarif:
    description: Upload the SARIF log to GitHub code scanning.
    required: false
    default: "true"
  python-version:
    description: Python version used to install and run vulnreach.
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install vulnreach
      shell: bash
      run: pip install "${{ github.action_path }}"

    - name: Run vulnreach audit
      id: scan
      shell: bash
      run: |
        set +e
        vulnreach audit "${{ inputs.path }}" ${{ inputs.offline == 'true' && '--offline' || '' }} --sarif "$RUNNER_TEMP/vulnreach.sarif" --markdown "$RUNNER_TEMP/vulnreach.md" --fail-on "${{ inputs.fail-on }}"
        echo "code=$?" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF to code scanning
      if: always() && inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ runner.temp }}/vulnreach.sarif

    - name: Post or update PR comment
      if: always() && inputs.comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- vulnreach-report -->';
          const path = `${process.env.RUNNER_TEMP}/vulnreach.md`;

          let report;
          try {
            report = fs.readFileSync(path, 'utf8');
          } catch (err) {
            report = '_vulnreach produced no report (the scan may have failed before writing one)._';
          }

          const body = `${marker}\n${report}`;
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner,
            repo,
            issue_number,
            per_page: 100,
          });
          const existing = comments.find(c => c.body && c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Propagate scan result
      if: always()
      shell: bash
      run: |
        if [ "${{ steps.scan.outputs.code }}" != "0" ]; then
          echo "vulnreach found findings at or above fail-on=${{ inputs.fail-on }}"
          exit 1
        fi
