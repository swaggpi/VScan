[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnreach"
version = "0.1.0"
description = "Reachability-aware dependency vulnerability scanner: knowledge graph, reachability, and CVE correlation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pathspec>=0.12",
    "tree-sitter-language-pack>=1.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
vulnreach = "scanner.cli:main"

[tool.setuptools.packages.find]
include = ["scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
