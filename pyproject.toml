[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnreach"
version = "0.1.0"
description = "Reachability-aware dependency vulnerability scanner: knowledge graph, reachability, and CVE correlation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pathspec>=0.12",
    "tree-sitter-language-pack>=1.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
mcp = [
    # FastMCP lives at ``mcp.server.fastmcp`` in the v1 SDK; mcp 2.x renamed it,
    # so we cap below 2 to keep the FastMCP stdio server importable. 1.10 is the
    # first release with the transport-security settings the HTTP mode adjusts.
    "mcp>=1.10,<2",
]

[project.scripts]
vulnreach = "scanner.cli:main"
vulnreach-mcp = "scanner.mcp.server:main"

[tool.setuptools.packages.find]
include = ["scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
